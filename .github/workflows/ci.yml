name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge test -vvv
      - run: forge build --build-info --extra-output abi
      - name: Generate pinned executor artifact
        run: node scripts/update-executor-artifact.cjs
      - name: Commit pinned executor artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- src/application/executor-artifact.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/application/executor-artifact.ts
            git commit -m "chore: refresh pinned executor artifact [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mainwell-scoped-recovery-executor-${{ github.sha }}
          path: out/ScopedRecoveryExecutor.sol/ScopedRecoveryExecutor.json
          if-no-files-found: error
          retention-days: 14

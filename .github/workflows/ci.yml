name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge test -vvv
      - run: forge build --build-info --extra-output abi
      - uses: actions/upload-artifact@v4
        with:
          name: mainwell-scoped-recovery-executor-${{ github.sha }}
          path: out/ScopedRecoveryExecutor.sol/ScopedRecoveryExecutor.json
          if-no-files-found: error
          retention-days: 14
